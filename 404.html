<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Julie Christensen | Keller Williams Real Estate</title>
<script>
// GitHub Pages SPA redirect: preserve the path and redirect to the root page.
// The main index.html reads the "p" query param and navigates to the correct section.
var path = window.location.pathname;
var search = window.location.search;
var hash = window.location.hash;
if (path && path !== '/') {
  var redirectUrl = '/?p=' + encodeURIComponent(path) +
    (search ? '&' + search.slice(1) : '') +
    (hash || '');
  window.location.replace(redirectUrl);
} else {
  window.location.replace('/');
}
</script>
</head>
<body></body>
</html>
